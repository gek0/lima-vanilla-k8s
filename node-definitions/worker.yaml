images:
  - location: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 2
memory: "4GiB"
disk: "20GiB"

mounts:
  - location: "{{.Home}}/Documents/projects/_local_/lima-vanilla-k8s"
    writable: true
    mountPoint: "/mnt/lima-vanilla-k8s"
  - location: "{{.Home}}/.ssh"
    writable: false
    mountPoint: "/mnt/ssh"

networks:
   - lima: user-v2

hostResolver:
  enabled: false
  ipv6: false
dns:
  - 8.8.8.8
  - 1.1.1.1

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      export HOST_PATH="/mnt/lima-vanilla-k8s"
      chmod +x $HOST_PATH/node-definitions/scripts/worker-provision.sh
      bash $HOST_PATH/node-definitions/scripts/worker-provision.sh
