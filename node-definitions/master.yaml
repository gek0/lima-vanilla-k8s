images:
  - location: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 2
memory: "4GiB"
disk: "10GiB"

mounts:
  - location: "~/Documents/projects/_local_/k8s_the_hard_way/lima-node-definitions/scripts"
    writable: true
  - location: "~/.ssh"
    writable: false

networks:
   - lima: user-v2

hostResolver:
  enabled: false
  ipv6: false
dns:
  - 8.8.8.8
  - 1.1.1.1

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      export HOST_PATH="/Users/matija_burisa/Documents/projects/_local_/k8s_the_hard_way"
      chmod +x $HOST_PATH/lima-node-definitions/scripts/master-provision.sh
      bash $HOST_PATH/lima-node-definitions/scripts/master-provision.sh
      ln -s $HOST_PATH/k8s /root/k8s
