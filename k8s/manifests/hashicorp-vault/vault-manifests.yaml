---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: vault-virtualservice
  namespace: vault
spec:
  hosts:
    - "vault.local.io"
  gateways:
    - istio-system/primary-gateway
  http:
    - route:
        - destination:
            host: vault.vault.svc.cluster.local
            port:
              number: 8200
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data-vault-0
  labels:
    type: local
spec:
  storageClassName: local-path
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/vault"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - worker-node-192-168-104-3
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: data-vault-0
  namespace: vault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: pv-data-vault-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
