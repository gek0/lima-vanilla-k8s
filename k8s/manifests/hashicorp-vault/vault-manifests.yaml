---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: vault-virtualservice
  namespace: vault
spec:
  hosts:
    - "vault.local.io"
  gateways:
    - istio-system/primary-gateway
  http:
    - route:
        - destination:
            host: vault.vault.svc.cluster.local
            port:
              number: 8200
