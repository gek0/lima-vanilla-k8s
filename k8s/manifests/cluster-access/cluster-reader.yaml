apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-reader
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-reader-token-secret
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: "cluster-reader"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: cluster-reader
    namespace: kube-system
